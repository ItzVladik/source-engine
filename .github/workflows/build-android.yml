name: android-build

on: 
  workflow_dispatch:

jobs:
  build-apk-for-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Cloning modlaucher repo and preparing for building
      run: |
        git clone https://github.com/ItzVladik/srceng-mod-launcher
        sudo apt-get update
        sudo apt-get install -f -y openjdk-8-jre zip apksigner imagemagick
        chmod +x srceng-mod-launcher/scripts/*.sh
    - name: Build Android (32 bit)
      run: |
        set -e
        srceng-mod-launcher/scripts/build-android-armv7a.sh
    - name: Build Android (64 bit)
      run: |
        set -e
        srceng-mod-launcher/scripts/build-android-aarch64.sh
    - name: Build APK
      run: |
        set -e
        srceng-mod-launcher/scripts/build-apk.sh
    - name: Rename APK
      run: |
        mv srceng-mod-launcher/build/android/mod-signed.apk mod-release.apk
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v3
      with:
        name: mod-apk
        path: mod-release.apk